description: Common properties for Zephyr cellular modems

include: uart-device.yaml

properties:
  mdm-power-gpios:
    type: phandle-array
    description: GPIO for modem power control

  mdm-reset-gpios:
    type: phandle-array
    description: GPIO for modem reset

  mdm-wake-gpios:
    type: phandle-array
    description: GPIO for modem wake

  mdm-ring-gpios:
    type: phandle-array
    description: GPIO for modem ring indicator

  cmux-runtime-pm:
    type: boolean
    description: Enable runtime power management for CMUX driver
